
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First Website</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #e0f2fe, #fce7f3, #ede9fe);
    }
    .card {
      max-width: 440px;
      margin: 24px;
      padding: 54px 40px;
      border-radius: 28px;
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(16px);
      text-align: center;
      box-shadow: 0 15px 50px rgba(80,100,150,0.10);
    }
    h1 { color: #6675b6; font-style: italic; }
    p { color: #64748b; line-height: 1.8; }
    .heart { font-size: 40px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">☁️</div>
    <h1>Hello, World!</h1>
    <p>Welcome to my first website.</p>
    <p>Made with creativity and a little magic.</p>
    <p>♡</p>
  </div>
</body>
</html>
